---
- name: Labyrinth bootstrap | install packages
  ansible.builtin.apt:
    name: "{{ labyrinth_package_names }}"
    state: present
    update_cache: true
  become: true

- name: Labyrinth bootstrap | ensure work directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ labyrinth_work_dir }}"
    - "{{ labyrinth_state_dir }}"

- name: Labyrinth bootstrap | install helper scripts
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ labyrinth_state_dir }}/{{ item.dest }}"
    mode: "0755"
  loop:
    - { src: skip_tool_mirror.py, dest: skip_tool_mirror.py }
    - { src: create_mythic_apitoken.py, dest: create_mythic_apitoken.py }
